# Settings for the photo frame. Install with:
#   sudo cp photos.conf /etc/photos.conf
# The program reads /etc/photos.conf, or the file given as its first argument.
# Every line is optional; leave one out (or delete this file) for the default.
# Changes take effect after `sudo systemctl restart slideshow`.

# Where the USB stick is mounted: the folder holding photos/ and favorites/.
photos_root = /mnt/photos

# While no screen is connected (no /dev/fb0), write each frame to this file,
# to watch with tools/pi-screen.py. It is rewritten every slide, so keep it in
# RAM (/dev/shm) rather than on the SD card. Remove the line to draw nothing
# when there is no screen. Once a screen appears, the program switches to it.
fb_file = ~/photo-output

# Size of the frames written to fb_file (WIDTHxHEIGHT).
fb_size = 1920x1080
